<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII-VOID</title>
</head>
<body>
    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(
            fetch("game.wasm"),
            go.importObject
        ).then(result => {
            go.run(result.instance)
        }).catch(error => {
            console.error("Failed to start ASCII-VOID", error);
        });
    </script>
</body>
</html>
