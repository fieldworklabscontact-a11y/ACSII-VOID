<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b0a" />
    <title>ascii-void</title>
  </head>
  <body>
    <div id="app"></div>
      <header>
        <div>
          <h1>ASCII<span>//</span>VOID</h1>
          <p>A universe governed by physics.</p>
        </div>
        <div id="status"> SIMULATION ACTIVE </div>
      </header>

      <main>
        <section class ="simulation">
          <canvas id="world"></canvas>
          <div class="overlay">Click to spawn ascii particles</div>
        </section>

      <section class="controls">
        <button id = "pause"> PAUSE</button>
        <button id = "reset">RESET</button>
        <label>
          GRAVITY
          <input id="gravity" type="range" min="0" max = "2000" value="700"/>
          <span id="gravity-value">700</span>
        </label>
        <label>
          PARTICLE SIZE
          <input id="size" type="ranges" min="3" max="15" value="7"/>
        </label>
      </section>
    </main>

    <footer>
      <span>PARTICLES: <b id=""count>0</b></span>
      <span>FPS: <b id="fps">0</b></span>
      <span>Engine: ASCII//VOID 0.1 <b id="fps">0</b></span>
    </footer>
  </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
